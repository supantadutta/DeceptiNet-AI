# DeceptiNet-AI configuration — single source of truth (spec §4).
#
# Phase 1 status: only `mode: vanilla` and the SSH service are implemented.
#   * mode: llm                -> Phase 2 (rejected by validation for now)
#   * http / mysql / pop3      -> Phase 3 (enabling them logs NOT IMPLEMENTED)
#   * llm.provider != static   -> Phase 2
# Any value here can be overridden by a DECEPTINET_* env var (see .env.example).

deceptinet:
  mode: "vanilla"            # "llm" | "vanilla"  <-- THE experimental switch (llm = Phase 2)
  experiment_id: "exp-001"

  services:
    ssh:   { enabled: true,  listen: "0.0.0.0:2222", persona: "ubuntu-22.04-webserver" }
    # The services below are defined for Phase 3. They are disabled now because
    # enabling an unimplemented service would be dishonest, not functional.
    http:  { enabled: false, listen: "0.0.0.0:8080", persona: "nginx-php-shop" }
    mysql: { enabled: false, listen: "0.0.0.0:3306", persona: "mysql-8-prod" }
    pop3:  { enabled: false, listen: "0.0.0.0:110",  persona: "dovecot-mailhost" }

  llm:                       # Phase 2 — present for completeness; only "static" usable now
    provider: "static"       # "claude" | "ollama" | "openai_compat" | "static"
    model: "claude-sonnet-4-6"
    max_tokens: 600
    temperature: 0.4
    timeout_s: 8
    fallback_provider: "static"

  cache:                     # Phase 2
    enabled: true
    semantic: true
    prewarm: true

  latency:                   # Phase 2/5 experimental variable
    inject_jitter_on_cache: false
    target_profile: "realistic"

  containment:
    egress: "deny"           # deny | allow_llm_only  (NEVER "allow"; enforced by docker-compose)
    kill_switch_file: "/run/deceptinet.stop"

  telemetry:
    classify_sessions: true  # classifier itself is Phase 4; sessions stored as "unknown" until then
    extract_iocs: true       # extractor is Phase 4
    attack_mapping: "mitre"  # mapper is Phase 4

  datastore:
    # SQLite by default so the system runs on a laptop with zero services.
    # Docker Compose overrides this with Postgres via DECEPTINET_DATASTORE_URL.
    url: "sqlite:///data/deceptinet.sqlite3"

  auth:
    accept_after_attempts: 2
    accept_credentials:
      - "root:root"
      - "root:123456"
      - "admin:admin"

  health:
    enabled: true
    listen: "0.0.0.0:8000"

  logging:
    level: "INFO"
