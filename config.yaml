# DeceptiNet-AI configuration — single source of truth (spec §4).
#
# Phase 1 status: only `mode: vanilla` and the SSH service are implemented.
#   * mode: llm                -> Phase 2 (rejected by validation for now)
#   * http / mysql / pop3      -> Phase 3 (enabling them logs NOT IMPLEMENTED)
#   * llm.provider != static   -> Phase 2
# Any value here can be overridden by a DECEPTINET_* env var (see .env.example).

deceptinet:
  mode: "vanilla"            # "llm" | "vanilla"  <-- THE experimental switch (llm = Phase 2)
  experiment_id: "exp-001"

  services:
    ssh:   { enabled: true,  listen: "0.0.0.0:2222", persona: "ubuntu-22.04-webserver" }
    http:  { enabled: true,  listen: "0.0.0.0:8080", persona: "nginx-php-shop" }
    mysql: { enabled: true,  listen: "0.0.0.0:3306", persona: "mysql-8-prod" }
    # POP3 on a high port so it binds as the non-root container user; map host
    # 110 -> 1100 in production (docker-compose / host firewall).
    pop3:  { enabled: true,  listen: "0.0.0.0:1100", persona: "dovecot-mailhost" }

  llm:                       # Phase 2 — used when mode: llm
    provider: "static"       # "claude" | "ollama" | "openai_compat" | "static"
    model: "claude-sonnet-4-6"   # operator's experimental variable
    max_tokens: 600          # small + no thinking => fast, low-latency responses
    temperature: 0.4         # only sent to models that accept it (not opus-4-8/4-7/fable)
    timeout_s: 8
    fallback_provider: "static"  # used if the primary provider errors/times out
    # For ollama / openai_compat (and self-hosted endpoints):
    base_url: null           # e.g. "http://ollama:11434" or "http://vllm:8000/v1"
    api_key: null            # prefer api_key_env over inlining secrets
    api_key_env: null        # e.g. "ANTHROPIC_API_KEY" (Claude reads this by default)
    augment_only: true       # LLM handles only commands vanilla can't (recommended)

  cache:                     # Phase 2
    enabled: true
    semantic: true
    prewarm: true

  latency:                   # Phase 2/5 experimental variable
    inject_jitter_on_cache: false
    target_profile: "realistic"

  containment:
    egress: "deny"           # deny | allow_llm_only  (NEVER "allow"; enforced by docker-compose)
    kill_switch_file: "/run/deceptinet.stop"

  telemetry:
    classify_sessions: true  # classifier itself is Phase 4; sessions stored as "unknown" until then
    extract_iocs: true       # extractor is Phase 4
    attack_mapping: "mitre"  # mapper is Phase 4

  datastore:
    # SQLite by default so the system runs on a laptop with zero services.
    # Docker Compose overrides this with Postgres via DECEPTINET_DATASTORE_URL.
    url: "sqlite:///data/deceptinet.sqlite3"

  auth:
    accept_after_attempts: 2
    accept_credentials:
      - "root:root"
      - "root:123456"
      - "admin:admin"

  health:
    enabled: true
    listen: "0.0.0.0:8000"

  logging:
    level: "INFO"
